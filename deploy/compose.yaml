# wyoming-vulkan: Wyoming speech-to-text (Parakeet, Whisper) and text-to-speech (Piper) for Home Assistant on a
# Vulkan GPU (tested: Intel iGPU, NVIDIA RTX 4060). Every host-specific value is in .env (copy .env.example); the structure (engines,
# endpoints, voice folders) is the server config inline below. Works as a Dockge stack (Dockge edits .env).
#
# Build the image first (Dockge cannot build it, it does not see the project folder):
#   docker build -t wyoming-vulkan:latest .        (in the project folder; tests/run.sh builds and tests it)
# Data: DATA_DIR holds models/<engine>/ (scripts/fetch-models.sh -d <DATA_DIR>/models) and voices/ (your own
# Piper voices, subfolders allowed). It may be a network share: the bind uses rslave propagation, so a share that is
# mounted after the container started still appears (until then the server exits and Docker restarts it).
services:
  wyoming-vulkan:
    image: ${WYOMING_VULKAN_IMAGE:-wyoming-vulkan:latest}
    pull_policy: never
    container_name: ${CONTAINER_NAME:-wyoming-vulkan}
    restart: unless-stopped
    # A second GPU from NVIDIA: DOCKER_RUNTIME=nvidia (NVIDIA Container Toolkit) and NVIDIA_VISIBLE_DEVICES; the
    # "graphics" capability brings NVIDIA's Vulkan driver into the container. Then choose per engine with *_GPU below.
    runtime: ${DOCKER_RUNTIME:-runc}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    user: "${PUID:-1000}:${PGID:-1000}"   # must be able to read the model and voice folders
    group_add: ["${RENDER_GID}"]          # the host group that owns the render node: getent group render
    devices:
      # The GPU's render node. A /dev/dri/by-path/pci-...-render path pins the device if a host has several GPUs.
      # (Long syntax: the colons in by-path names confuse the short one.)
      - source: ${RENDER_DEVICE:-/dev/dri/renderD128}
        target: /dev/dri/renderD128
        permissions: rwm
    ports:
      - "${WYOMING_PORT:-10310}:10310"    # Parakeet speech-to-text + all voices
      - "${WHISPER_PORT:-10311}:10311"    # Whisper speech-to-text (a second choice in Home Assistant)
      - "${DIAG_PORT:-10312}:10312"       # diagnostics web page (models, voices, sample speech, benchmark)
    configs:
      - source: wyoming_vulkan_config
        target: /etc/wyoming-vulkan/config.toml
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        read_only: true
        bind: { propagation: rslave, create_host_path: true }
      # Optional extra voice folder (a missing or unreachable folder only removes its voices)
      - type: bind
        source: ${EXTRA_VOICES_DIR:-./voices-extra}
        target: /voices-extra
        read_only: true
        bind: { create_host_path: true }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

configs:
  wyoming_vulkan_config:
    # The server's config (TOML) with values from .env. All options: config/config.example.toml.
    content: |
      # Home Assistant makes one speech-to-text entity per port and never chooses a model itself,
      # so each speech-to-text engine gets its own port. The voices are offered on the Parakeet port.
      [server]                           # host port WYOMING_PORT
      uri = "tcp://0.0.0.0:10310"
      stt = ["parakeet"]
      max_loaded_voices = ${MAX_LOADED_VOICES:-2}
      web_port = 10312                   # diagnostics page inside the container (host port DIAG_PORT); 0 = off

      [[endpoint]]                       # host port WHISPER_PORT
      uri = "tcp://0.0.0.0:10311"
      stt = ["whisper"]

      # The default GPU (part of its Vulkan name); each engine can pick another with gpu = "intel" | "nvidia" |
      # "amd" | "<part of the name>", and device = "gpu" | "cpu" | "auto" (GPU, else CPU with a warning).
      [gpu]
      name_contains = "${GPU_NAME_CONTAINS:-Intel}"
      vendor_id = ${GPU_VENDOR_ID:-0x8086}

      [[stt]]
      name = "parakeet"
      backend = "parakeet.cpp"
      model = "/data/models/parakeet/${PARAKEET_MODEL:-ggml-parakeet-tdt-0.6b-v3-q8_0.bin}"
      device = "${WYOMING_DEVICE:-auto}"
      languages = "${PARAKEET_LANGUAGES:-en}"   # comma-separated, or auto (all 25 of Parakeet v3)
      gpu = "${PARAKEET_GPU:-}"
      description = "Parakeet"
      threads = ${STT_THREADS:-4}

      [[stt]]
      name = "whisper"
      backend = "whisper.cpp"
      model = "/data/models/whisper/${WHISPER_MODEL:-ggml-small.bin}"
      device = "${WYOMING_DEVICE:-auto}"
      gpu = "${WHISPER_GPU:-}"
      languages = "auto"                 # every Whisper language (only "en" for .en models)
      description = "${WHISPER_DESCRIPTION:-Whisper small}"
      audio_ctx = ${WHISPER_AUDIO_CTX:-512}
      threads = ${STT_THREADS:-4}

      [[tts]]                            # the default voice: loaded and warmed up at start
      name = "${DEFAULT_VOICE:-en_US-ljspeech-high}"
      backend = "piper"
      model = "/data/models/piper/${DEFAULT_VOICE:-en_US-ljspeech-high}.onnx"
      device = "${WYOMING_DEVICE:-auto}"
      gpu = "${ONNX_GPU:-}"              # Piper, Kokoro, Kitten, Pocket: one GPU for all of them (ONNX Runtime limit)
      languages = ["${DEFAULT_VOICE_LANGUAGE:-en_US}"]

      # Voice packs: one model, many voices, offered as "<pack>_<voice>" ("Kokoro af_heart [<device>]" in HA) and
      # loaded on first use. Missing files only leave the pack out (warning in the log).
      [[tts_pack]]
      name = "kokoro"                    # Kokoro-82M: 42 voices, English (US/GB), es, fr, hi, it, pt
      backend = "kokoro"
      model = "/data/models/kokoro/model.onnx"
      device = "${WYOMING_DEVICE:-auto}"
      gpu = "${ONNX_GPU:-}"

      [[tts_pack]]
      name = "kitten"                    # KittenTTS nano (15M, the fastest engine here): 8 English voices
      backend = "kitten"
      model = "/data/models/kitten/kitten_tts_nano_v0_8.onnx"
      device = "${WYOMING_DEVICE:-auto}"
      gpu = "${ONNX_GPU:-}"

      [[tts_pack]]
      name = "pocket"                    # Pocket TTS (Kyutai): 6 English voices, streams 80 ms frames (first audio ~0.1 s)
      backend = "pocket"
      model = "/data/models/pocket/pocket-tts-english.onnx"
      device = "${POCKET_DEVICE:-cpu}"   # autoregressive: faster on the CPU than on a small iGPU
      gpu = "${ONNX_GPU:-}"
      exclude = ["cosette"]              # a very quiet voice that fails half of the round-trip tests

      [[tts_pack]]
      name = "cosyvoice"                 # CosyVoice3 0.5B (cosyvoice.cpp): voice cloning, 9 languages, needs a strong GPU
      backend = "cosyvoice"
      model = "/data/models/cosyvoice/CosyVoice3-2512_Q8_0.gguf"
      enabled = ${COSYVOICE_ENABLED:-false}  # real time on an RTX 4060; ~10x slower than real time on an N305 iGPU
      device = "${COSYVOICE_DEVICE:-gpu}"
      gpu = "${COSYVOICE_GPU:-}"
      stream = ${COSYVOICE_STREAM:-false}    # true: first audio sooner (0.35 s on an RTX 4060), more GPU time in total
      languages = "auto"                 # every voice speaks all of CosyVoice3's languages
      # voices: /data/models/cosyvoice/voices/<name>.wav + <name>.txt (the clip's exact transcript), or <name>.gguf

      # Piper speech settings for every voice; empty = the voice's own value (the "inference" section of its
      # .onnx.json, typically length_scale 1.0, noise_scale 0.667, noise_w 0.8). Kokoro and Kitten use length_scale.
      #   length_scale  speaking speed: > 1 slower, < 1 faster
      #   noise_scale   variation / expressiveness of the audio
      #   noise_w       variation of phoneme durations (rhythm)
      [voice_settings."*"]
      length_scale = "${PIPER_LENGTH_SCALE:-}"
      noise_scale = "${PIPER_NOISE_SCALE:-}"
      noise_w = "${PIPER_NOISE_W:-}"

      # Per voice (by voice name; overrides the values above), e.g.:
      # [voice_settings."en_US-ljspeech-high"]
      # length_scale = 1.1
      # [voice_settings."kokoro_af_heart"]
      # length_scale = 0.95

      # Piper voice folders, offered to Home Assistant and loaded on first use; a name found in an earlier folder wins.
      [[tts_library]]
      path = "/data/models/piper"
      device = "${WYOMING_DEVICE:-auto}"
      gpu = "${ONNX_GPU:-}"

      [[tts_library]]
      path = "/data/voices"
      device = "${WYOMING_DEVICE:-auto}"
      gpu = "${ONNX_GPU:-}"
      optional = true
      recursive = true

      [[tts_library]]
      path = "/voices-extra"
      device = "${WYOMING_DEVICE:-auto}"
      gpu = "${ONNX_GPU:-}"
      optional = true
      min_age_seconds = ${EXTRA_VOICES_MIN_AGE:-60}
